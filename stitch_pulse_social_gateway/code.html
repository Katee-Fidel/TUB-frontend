<body class="bg-background text-on-background min-h-screen flex selection:bg-primary selection:text-on-primary overflow-x-hidden font-body-md">

<!-- Sign In Form -->
<form class="space-y-6" id="form-signin">

</div>

<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex items-center justify-between">

<script>
        function switchTab(tab) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const btnSignin = document.getElementById('btn-signin');
            const btnSignup = document.getElementById('btn-signup');
            const indicator = document.getElementById('toggle-indicator');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                btnSignin.classList.replace('text-on-surface-variant', 'text-on-primary');
                btnSignup.classList.replace('text-on-primary', 'text-on-surface-variant');
                
                indicator.style.transform = 'translateX(0)';
            } else {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                
                btnSignup.classList.replace('text-on-surface-variant', 'text-on-primary');
                btnSignin.classList.replace('text-on-primary', 'text-on-surface-variant');
                
                indicator.style.transform = 'translateX(100%)';
            }
        }
    </script>
